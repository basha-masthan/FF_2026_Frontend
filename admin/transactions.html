<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction Management - Admin</title>
    <link rel="stylesheet" href="../css/admin-dashboard.css">
    <script src="../config.js"></script>
    <script src="../api-service.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Override specific transaction styles if needed */
        .transactions-content {
            padding: 20px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #eee;
        }

        .header h1 {
            color: #333;
            font-size: 28px;
        }

        .back-btn {
            padding: 10px 20px;
            background: #6c757d;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        .back-btn:hover {
            background: #5a6268;
        }

        .filters-panel {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        .filter-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
        }

        .filter-group label {
            font-weight: 600;
            color: #555;
            margin-bottom: 5px;
            font-size: 13px;
        }

        .filter-group select,
        .filter-group input {
            padding: 8px 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }

        .filter-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn-success:hover {
            background: #218838;
        }

        .transactions-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .transactions-table th {
            background: #f8f9fa;
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: #333;
            border-bottom: 2px solid #dee2e6;
            position: sticky;
            top: 0;
        }

        .transactions-table td {
            padding: 12px 15px;
            border-bottom: 1px solid #dee2e6;
        }

        .transactions-table tr:hover {
            background: #f8f9fa;
        }

        .type-badge {
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 11px;
            font-weight: 600;
            display: inline-block;
        }

        .type-deposit {
            background: #d4edda;
            color: #155724;
        }

        .type-winning {
            background: #fff3cd;
            color: #856404;
        }

        .type-entry_fee {
            background: #f8d7da;
            color: #721c24;
        }

        .type-withdrawal {
            background: #d1ecf1;
            color: #0c5460;
        }

        .amount-positive {
            color: #28a745;
            font-weight: 600;
        }

        .amount-negative {
            color: #dc3545;
            font-weight: 600;
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 2px solid #eee;
        }

        .page-btn {
            padding: 8px 15px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .page-btn:hover:not(:disabled) {
            background: #667eea;
            color: white;
        }

        .page-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .page-info {
            font-weight: 600;
            color: #555;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state i {
            font-size: 64px;
            margin-bottom: 20px;
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-card h3 {
            font-size: 14px;
            margin-bottom: 10px;
            opacity: 0.9;
        }

        .stat-card .value {
            font-size: 28px;
            font-weight: 700;
        }
    </style>
</head>

<body>
    <div class="admin-dashboard">
        <!-- Sidebar -->
        <aside class="admin-sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <i class="fas fa-gamepad"></i>
                    <span>Future Bound</span>
                </div>
                <div class="admin-badge">
                    <i class="fas fa-crown"></i>
                    <span>Admin Panel</span>
                </div>
            </div>

            <nav class="sidebar-nav">
                <a href="admin-dashboard.html" class="nav-item">
                    <i class="fas fa-chart-line"></i>
                    <span>Dashboard</span>
                </a>
                <a href="#" class="nav-item" data-section="users">
                    <i class="fas fa-users"></i>
                    <span>Users</span>
                </a>
                <a href="tournament-registrations.html" class="nav-item">
                    <i class="fas fa-clipboard-list"></i>
                    <span>Registrations</span>
                </a>
                <a href="chat-support.html" class="nav-item">
                    <i class="fas fa-comments"></i>
                    <span>Chat Support</span>
                </a>
                <a href="transactions.html" class="nav-item active">
                    <i class="fas fa-exchange-alt"></i>
                    <span>Transactions</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <button onclick="adminLogout()" class="logout-btn">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Logout</span>
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="admin-main">
            <header class="main-header">
                <div class="header-left">
                    <h1 id="pageTitle">Transaction Management</h1>
                </div>
            </header>

            <div class="main-content">
                <div class="transactions-content">
                    <!-- Existing content wrapped -->
                    <div class="stats-row" id="statsRow"></div>

                    <div class="filters-panel">
                        <div class="filter-row">
                            <div class="filter-group">
                                <label>Transaction Type</label>
                                <select id="filterType">
                                    <option value="all">All Types</option>
                                    <option value="deposit">Deposit</option>
                                    <option value="winning">Winning</option>
                                    <option value="entry_fee">Entry Fee</option>
                                    <option value="withdrawal">Withdrawal</option>
                                </select>
                            </div>
                            <div class="filter-group">
                                <label>Status</label>
                                <select id="filterStatus">
                                    <option value="all">All Status</option>
                                    <option value="completed">Completed</option>
                                    <option value="pending">Pending</option>
                                    <option value="failed">Failed</option>
                                </select>
                            </div>
                            <div class="filter-group">
                                <label>Start Date</label>
                                <input type="date" id="filterStartDate">
                            </div>
                            <div class="filter-group">
                                <label>End Date</label>
                                <input type="date" id="filterEndDate">
                            </div>
                        </div>
                        <div class="filter-row">
                            <div class="filter-group">
                                <label>Min Amount ($)</label>
                                <input type="number" id="filterMinAmount" placeholder="0">
                            </div>
                            <div class="filter-group">
                                <label>Max Amount ($)</label>
                                <input type="number" id="filterMaxAmount" placeholder="1000">
                            </div>
                            <div class="filter-group">
                                <label>Items Per Page</label>
                                <select id="filterLimit">
                                    <option value="25">25</option>
                                    <option value="50" selected>50</option>
                                    <option value="100">100</option>
                                </select>
                            </div>
                        </div>
                        <div class="filter-actions">
                            <button class="btn btn-secondary" onclick="resetFilters()">
                                <i class="fas fa-undo"></i> Reset
                            </button>
                            <button class="btn btn-primary" onclick="applyFilters()">
                                <i class="fas fa-filter"></i> Apply Filters
                            </button>
                            <button class="btn btn-success" onclick="exportCSV()">
                                <i class="fas fa-download"></i> Export CSV
                            </button>
                        </div>
                    </div>

                    <div id="loading" class="loading" style="display: none;">
                        <i class="fas fa-spinner fa-spin fa-3x"></i>
                        <p>Loading transactions...</p>
                    </div>

                    <div id="tableContainer"></div>

                    <div class="pagination" id="pagination" style="display: none;"></div>
                </div>
            </div>
        </main>
    </div>

    <script>
        let currentPage = 1;
        let totalPages = 1;
        let currentData = null;

        // Check admin authentication
        if (!ApiService.isAdminAuthenticated()) {
            window.location.href = 'admin-login.html';
        }

        // Load transactions on page load
        document.addEventListener('DOMContentLoaded', () => {
            loadTransactions();
        });

        async function loadTransactions(page = 1) {
            const loading = document.getElementById('loading');
            const tableContainer = document.getElementById('tableContainer');
            const paginationDiv = document.getElementById('pagination');

            loading.style.display = 'block';
            tableContainer.innerHTML = '';
            paginationDiv.style.display = 'none';

            try {
                const filters = getFilters();
                filters.page = page;

                const data = await ApiService.admin.getTransactionsFiltered(filters);
                currentData = data;
                currentPage = data.pagination.page;
                totalPages = data.pagination.pages;

                displayTransactions(data.transactions);
                displayPagination(data.pagination);
                displayStats(data.transactions);
            } catch (error) {
                console.error('Error loading transactions:', error);
                tableContainer.innerHTML = `<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>Error loading transactions: ${error.message}</p></div>`;
            } finally {
                loading.style.display = 'none';
            }
        }

        function getFilters() {
            return {
                type: document.getElementById('filterType').value,
                status: document.getElementById('filterStatus').value,
                startDate: document.getElementById('filterStartDate').value,
                endDate: document.getElementById('filterEndDate').value,
                minAmount: document.getElementById('filterMinAmount').value,
                maxAmount: document.getElementById('filterMaxAmount').value,
                limit: document.getElementById('filterLimit').value
            };
        }

        function displayTransactions(transactions) {
            const tableContainer = document.getElementById('tableContainer');

            if (transactions.length === 0) {
                tableContainer.innerHTML = '<div class="empty-state"><i class="fas fa-inbox"></i><p>No transactions found</p></div>';
                return;
            }

            let html = `
                <table class="transactions-table">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>User</th>
                            <th>Type</th>
                            <th>Amount</th>
                            <th>Description</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            transactions.forEach(t => {
                const date = new Date(t.createdAt).toLocaleString();
                const amountClass = t.amount >= 0 ? 'amount-positive' : 'amount-negative';
                const amountSign = t.amount >= 0 ? '+' : '';

                html += `
                    <tr>
                        <td>${date}</td>
                        <td>${t.userId?.fullname || 'N/A'}<br><small>${t.userId?.email || ''}</small></td>
                        <td><span class="type-badge type-${t.type}">${t.type.replace('_', ' ').toUpperCase()}</span></td>
                        <td class="${amountClass}">${amountSign}$${Math.abs(t.amount).toFixed(2)}</td>
                        <td>${t.description}</td>
                        <td>${t.status}</td>
                    </tr>
                `;
            });

            html += '</tbody></table>';
            tableContainer.innerHTML = html;
        }

        function displayPagination(pagination) {
            const paginationDiv = document.getElementById('pagination');

            if (pagination.pages <= 1) {
                paginationDiv.style.display = 'none';
                return;
            }

            paginationDiv.style.display = 'flex';
            paginationDiv.innerHTML = `
                <button class="page-btn" onclick="loadTransactions(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>
                    <i class="fas fa-chevron-left"></i> Previous
                </button>
                <span class="page-info">Page ${currentPage} of ${pagination.pages} (${pagination.total} total)</span>
                <button class="page-btn" onclick="loadTransactions(${currentPage + 1})" ${currentPage === pagination.pages ? 'disabled' : ''}>
                    Next <i class="fas fa-chevron-right"></i>
                </button>
            `;
        }

        function displayStats(transactions) {
            const statsRow = document.getElementById('statsRow');

            const totalDeposits = transactions.filter(t => t.type === 'deposit').reduce((sum, t) => sum + t.amount, 0);
            const totalWithdrawals = transactions.filter(t => t.type === 'withdrawal').reduce((sum, t) => sum + Math.abs(t.amount), 0);
            const totalFees = transactions.filter(t => t.type === 'entry_fee').reduce((sum, t) => sum + Math.abs(t.amount), 0);
            const totalWinnings = transactions.filter(t => t.type === 'winning').reduce((sum, t) => sum + t.amount, 0);

            statsRow.innerHTML = `
                <div class="stat-card">
                    <h3>Page Deposits</h3>
                    <div class="value">$${totalDeposits.toFixed(2)}</div>
                </div>
                <div class="stat-card">
                    <h3>Page Withdrawals</h3>
                    <div class="value">$${totalWithdrawals.toFixed(2)}</div>
                </div>
                <div class="stat-card">
                    <h3>Page Entry Fees</h3>
                    <div class="value">$${totalFees.toFixed(2)}</div>
                </div>
                <div class="stat-card">
                    <h3>Page Winnings</h3>
                    <div class="value">$${totalWinnings.toFixed(2)}</div>
                </div>
            `;
        }

        function applyFilters() {
            currentPage = 1;
            loadTransactions(1);
        }

        function resetFilters() {
            document.getElementById('filterType').value = 'all';
            document.getElementById('filterStatus').value = 'all';
            document.getElementById('filterStartDate').value = '';
            document.getElementById('filterEndDate').value = '';
            document.getElementById('filterMinAmount').value = '';
            document.getElementById('filterMaxAmount').value = '';
            document.getElementById('filterLimit').value = '50';
            applyFilters();
        }

        function exportCSV() {
            if (!currentData || !currentData.transactions.length) {
                alert('No data to export');
                return;
            }

            const transactions = currentData.transactions;
            let csv = 'Date,User,Email,Type,Amount,Description,Status\n';

            transactions.forEach(t => {
                const date = new Date(t.createdAt).toLocaleString();
                const user = (t.userId?.fullname || 'N/A').replace(/,/g, ';');
                const email = (t.userId?.email || '').replace(/,/g, ';');
                const desc = (t.description || '').replace(/,/g, ';');

                csv += `"${date}","${user}","${email}","${t.type}","${t.amount}","${desc}","${t.status}"\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `transactions_${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
            window.URL.revokeObjectURL(url);
        }
    </script>
</body>

</html>
