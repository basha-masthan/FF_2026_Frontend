<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>Chat Support - Future Bound Admin</title>
    <link rel="stylesheet" href="../css/admin-dashboard.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="../config.js"></script>
    <script src="../api-service.js"></script>
    <style>
        /* Chat specific styles */
        .chat-container {
            display: flex;
            height: calc(100vh - 140px);
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        .chat-sidebar {
            width: 350px;
            border-right: 1px solid #e1e5e9;
            display: flex;
            flex-direction: column;
            background: #f8f9fa;
        }

        .chat-sidebar-header {
            padding: 20px;
            background: white;
            border-bottom: 1px solid #e1e5e9;
        }

        .chat-search input {
            width: 100%;
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #f8f9fa;
        }

        .chat-users-list {
            flex: 1;
            overflow-y: auto;
        }

        .chat-user-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px 20px;
            cursor: pointer;
            transition: all 0.2s;
            border-bottom: 1px solid #eee;
        }

        .chat-user-item:hover {
            background: #fff;
        }

        .chat-user-item.active {
            background: #eef2ff;
            border-left: 4px solid #667eea;
        }

        .user-avatar {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
        }

        .user-info {
            flex: 1;
            min-width: 0;
        }

        .user-name {
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 3px;
        }

        .prev-msg {
            font-size: 0.85rem;
            color: #6c757d;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .msg-meta {
            text-align: right;
            font-size: 0.75rem;
            color: #999;
        }

        .unread-badge {
            background: #ff4757;
            color: white;
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 10px;
            margin-top: 4px;
            display: inline-block;
        }

        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #f0f2f5;
            /* Light grey background like WhatsApp */
        }

        .chat-header {
            padding: 15px 25px;
            background: white;
            border-bottom: 1px solid #e1e5e9;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background-image: linear-gradient(#f0f2f5 2px, transparent 2px), linear-gradient(90deg, #f0f2f5 2px, transparent 2px);
            background-size: 20px 20px;
        }

        .message {
            max-width: 70%;
            padding: 10px 15px;
            border-radius: 12px;
            position: relative;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .message.user {
            align-self: flex-start;
            background: white;
            color: #333;
            border-bottom-left-radius: 0;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
        }

        .message.admin {
            align-self: flex-end;
            background: #667eea;
            /* WhatsApp-like Green: #dcf8c6, but sticking to brand color */
            color: white;
            border-bottom-right-radius: 0;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
        }

        .message-time {
            font-size: 0.7rem;
            margin-top: 4px;
            opacity: 0.7;
            text-align: right;
        }

        .chat-input-area {
            padding: 20px;
            background: white;
            border-top: 1px solid #e1e5e9;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .chat-input {
            flex: 1;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 25px;
            font-size: 1rem;
            resize: none;
            height: 48px;
            line-height: 24px;
        }

        .send-btn {
            width: 50px;
            height: 50px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }

        .send-btn:hover {
            transform: scale(1.1);
        }

        .empty-chat-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #adb5bd;
        }
    </style>
</head>

<body>
    <div class="admin-dashboard">
        <!-- Sidebar -->
        <aside class="admin-sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <i class="fas fa-gamepad"></i>
                    <span>Future Bound</span>
                </div>
                <div class="admin-badge">
                    <i class="fas fa-crown"></i>
                    <span>Admin Panel</span>
                </div>
            </div>

            <nav class="sidebar-nav">
                <a href="admin-dashboard.html" class="nav-item">
                    <i class="fas fa-chart-line"></i>
                    <span>Dashboard</span>
                </a>
                <a href="#" class="nav-item">
                    <i class="fas fa-users"></i>
                    <span>Users</span>
                </a>
                <a href="tournament-registrations.html" class="nav-item">
                    <i class="fas fa-clipboard-list"></i>
                    <span>Registrations</span>
                </a>
                <a href="chat-support.html" class="nav-item active">
                    <i class="fas fa-comments"></i>
                    <span>Chat Support</span>
                </a>
                <a href="transactions.html" class="nav-item">
                    <i class="fas fa-exchange-alt"></i>
                    <span>Transactions</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <button onclick="adminLogout()" class="logout-btn">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Logout</span>
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="admin-main">
            <header class="main-header">
                <div class="header-left">
                    <h1 id="pageTitle">Support Center</h1>
                </div>
            </header>

            <div class="main-content" style="padding-top: 20px;">
                <div class="chat-container">
                    <!-- Chat Sidebar (User List) -->
                    <div class="chat-sidebar">
                        <div class="chat-sidebar-header">
                            <div class="chat-search">
                                <input type="text" placeholder="Search chats..." id="searchChatInput">
                            </div>
                        </div>
                        <div class="chat-users-list" id="chatUsersList">
                            <!-- Users will be loaded here -->
                            <div style="text-align: center; padding: 20px; color: #999;">Loading...</div>
                        </div>
                    </div>

                    <!-- Chat Main Area -->
                    <div class="chat-main">
                        <div class="chat-header" id="chatHeader" style="display: none;">
                            <div class="user-avatar" id="activeUserAvatar">U</div>
                            <div class="user-info">
                                <div class="user-name" id="activeUserName">User Name</div>
                                <div style="font-size: 0.8rem; color: #666;" id="activeUserEmail">email@example.com
                                </div>
                            </div>
                        </div>

                        <div class="chat-messages" id="chatMessages">
                            <div class="empty-chat-state">
                                <i class="fas fa-comments" style="font-size: 3rem; margin-bottom: 15px;"></i>
                                <p>Select a conversation to start chatting</p>
                            </div>
                        </div>

                        <div class="chat-input-area" id="chatInputArea" style="display: none;">
                            <textarea class="chat-input" placeholder="Type your reply..." id="messageInput"></textarea>
                            <button class="send-btn" onclick="sendReply()">
                                <i class="fas fa-paper-plane"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        let currentUserId = null;
        let pollingInterval = null;

        // Check authentication
        if (!localStorage.getItem('adminToken')) {
            window.location.href = 'admin-login.html';
        }

        document.addEventListener('DOMContentLoaded', async () => {
            await loadChatUsers();

            // Check for auto-open chat
            const openChatUser = sessionStorage.getItem('openChatUser');
            if (openChatUser) {
                try {
                    const user = JSON.parse(openChatUser);
                    sessionStorage.removeItem('openChatUser'); // Clear it
                    openChat(user.userId, user.fullname, user.email);
                } catch (e) {
                    console.error('Error parsing openChatUser', e);
                }
            }

            // Poll for new users/messages every 5 seconds
            setInterval(loadChatUsers, 5000);
        });

        async function loadChatUsers() {
            try {
                const response = await fetch(`${API_CONFIG.BASE_URL}/admin/support/users`, {
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('adminToken')}` }
                });
                const users = await response.json();
                renderUsersList(users);
            } catch (error) {
                console.error('Error loading chat users:', error);
            }
        }

        function renderUsersList(users) {
            const listContainer = document.getElementById('chatUsersList');
            // Don't fully redraw if only updating status, but for simplicity we redraw now
            // Ideally should diff, but this is MVP

            // Allow search
            const searchTerm = document.getElementById('searchChatInput').value.toLowerCase();
            const filteredUsers = users.filter(u =>
                u.fullname.toLowerCase().includes(searchTerm) ||
                u.email.toLowerCase().includes(searchTerm)
            );

            listContainer.innerHTML = filteredUsers.map(user => `
                <div class="chat-user-item ${currentUserId === user.userId ? 'active' : ''}" onclick="openChat('${user.userId}', '${user.fullname}', '${user.email}')">
                    <div class="user-avatar">${user.fullname.charAt(0)}</div>
                    <div class="user-info">
                        <div class="user-name">${user.fullname}</div>
                        <div class="prev-msg">${user.lastMessage}</div>
                    </div>
                    <div class="msg-meta">
                        <div>${new Date(user.lastMessageTime).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</div>
                        ${user.unreadCount > 0 ? `<span class="unread-badge">${user.unreadCount}</span>` : ''}
                    </div>
                </div>
            `).join('');
        }

        async function openChat(userId, fullname, email) {
            currentUserId = userId;

            // Update Header
            document.getElementById('chatHeader').style.display = 'flex';
            document.getElementById('chatInputArea').style.display = 'flex';
            document.getElementById('activeUserName').textContent = fullname;
            document.getElementById('activeUserAvatar').textContent = fullname.charAt(0);
            document.getElementById('activeUserEmail').textContent = email;

            // Load Messages
            await loadMessages(userId);

            // Scroll to bottom
            const messagesContainer = document.getElementById('chatMessages');
            messagesContainer.scrollTop = messagesContainer.scrollHeight;

            if (pollingInterval) clearInterval(pollingInterval);
            pollingInterval = setInterval(() => loadMessages(userId, false), 3000);

            // Refresh user list to clear unread badge locally for UI feel (real update comes from server)
            loadChatUsers();
        }

        async function loadMessages(userId, scroll = true) {
            if (currentUserId !== userId) return; // Prevent race conditions

            try {
                const response = await fetch(`${API_CONFIG.BASE_URL}/admin/support/messages/${userId}`, {
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('adminToken')}` }
                });
                const messages = await response.json();

                const messagesContainer = document.getElementById('chatMessages');

                // If specific UI state check needed to avoid flicker, can do here.
                // For now, simpler:
                messagesContainer.innerHTML = messages.map(msg => `
                    <div class="message ${msg.sender}">
                        <div class="content">${msg.message}</div>
                        <div class="message-time">${new Date(msg.createdAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</div>
                    </div>
                `).join('');

                if (scroll) {
                    messagesContainer.scrollTop = messagesContainer.scrollHeight;
                }
            } catch (error) {
                console.error('Error loading messages:', error);
            }
        }

        async function sendReply() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            if (!message || !currentUserId) return;

            try {
                const response = await fetch(`${API_CONFIG.BASE_URL}/admin/support/reply`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('adminToken')}`
                    },
                    body: JSON.stringify({ userId: currentUserId, message })
                });

                if (response.ok) {
                    input.value = '';
                    loadMessages(currentUserId, true);
                    loadChatUsers(); // Update sidebar "last message"
                }
            } catch (error) {
                console.error('Error sending reply:', error);
                alert('Failed to send reply');
            }
        }

        function adminLogout() {
            localStorage.removeItem('adminToken');
            window.location.href = 'admin-login.html';
        }
    </script>
</body>

</html>
