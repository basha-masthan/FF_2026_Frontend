<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Support - Winzone Arena</title>
    <link rel="stylesheet" href="css/index.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="config.js"></script>
    <script src="api-service.js"></script>
    <style>
        .chat-page {
            max-width: 800px;
            margin: 100px auto 40px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
            height: calc(100vh - 160px);
            overflow: hidden;
        }

        .chat-header {
            padding: 20px;
            background: #fff;
            border-bottom: 1px solid #e1e5e9;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .admin-avatar {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, #ff6b35, #ff4d94);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.2rem;
        }

        .chat-title h2 {
            font-size: 1.1rem;
            margin: 0;
            color: #333;
        }

        .chat-title p {
            margin: 0;
            font-size: 0.85rem;
            color: #666;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: #f8f9fa;
        }

        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 12px;
            position: relative;
            line-height: 1.5;
            font-size: 0.95rem;
        }

        .message.admin {
            align-self: flex-start;
            background: white;
            color: #333;
            border: 1px solid #e1e5e9;
            border-bottom-left-radius: 2px;
        }

        .message.user {
            align-self: flex-end;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 2px;
            box-shadow: 0 4px 10px rgba(102, 126, 234, 0.2);
        }

        .message-time {
            font-size: 0.7rem;
            margin-top: 5px;
            opacity: 0.7;
            text-align: right;
        }

        .chat-input-area {
            padding: 20px;
            background: white;
            border-top: 1px solid #e1e5e9;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .chat-input {
            flex: 1;
            padding: 12px 20px;
            border: 1px solid #ddd;
            border-radius: 30px;
            outline: none;
            transition: all 0.3s;
            font-size: 1rem;
        }

        .chat-input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .send-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }

        .send-btn:hover {
            transform: scale(1.1);
        }

        .empty-state {
            text-align: center;
            margin-top: 50px;
            color: #999;
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="navbar-content">
            <a href="index.html" class="navbar-brand">
                <i class="fas fa-trophy"></i>
                Winzone Arena
            </a>
            <div style="display: flex; align-items: center; gap: 20px;">
                <a href="index.html" style="color: white; text-decoration: none;">
                    <i class="fas fa-home"></i> Home
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="chat-page">
        <div class="chat-header">
            <div class="admin-avatar">
                <i class="fas fa-headset"></i>
            </div>
            <div class="chat-title">
                <h2>Customer Support</h2>
                <p>We typically reply within a few minutes</p>
            </div>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="empty-state">
                <i class="fas fa-comments" style="font-size: 3rem; margin-bottom: 10px;"></i>
                <p>Start a conversation with our support team.</p>
            </div>
        </div>

        <div class="chat-input-area">
            <input type="text" class="chat-input" id="messageInput" placeholder="Type your message..."
                onkeypress="handleKeyPress(event)">
            <button class="send-btn" onclick="sendMessage()">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
    </div>

    <script>
        let pollingInterval = null;

        // Check authentication
        window.addEventListener('DOMContentLoaded', () => {
            if (!ApiService.isAuthenticated()) {
                window.location.href = 'auth.html';
                return;
            }

            loadMessages();
            // Poll for new messages every 3 seconds
            pollingInterval = setInterval(loadMessages, 3000);
        });

        async function loadMessages() {
            try {
                const messages = await ApiService.user.getSupportMessages();
                const container = document.getElementById('chatMessages');

                if (!messages || messages.length === 0) {
                    // Keep empty state if no messages
                    if (container.children.length === 0 || container.querySelector('.empty-state')) {
                        container.innerHTML = `
                            <div class="empty-state">
                                <i class="fas fa-comments" style="font-size: 3rem; margin-bottom: 15px;"></i>
                                <p>Start a conversation with our support team.</p>
                            </div>
                         `;
                    }
                    return;
                }

                // If we have messages, render them
                // Simple render - ideally allow scrolling adjustment
                const wasAtBottom = container.scrollHeight - container.scrollTop === container.clientHeight;

                container.innerHTML = messages.map(msg => `
                    <div class="message ${msg.sender === 'user' ? 'user' : 'admin'}">
                        <div class="content">${msg.message}</div>
                        <div class="message-time">${new Date(msg.createdAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</div>
                    </div>
                `).join('');

                // Auto-scroll to bottom only if user was at bottom or it's first load
                // For simplicity, always scroll on first load or new message (checking lengths would be better)
                if (wasAtBottom || true) { // Force scroll for MVP
                    container.scrollTop = container.scrollHeight;
                }

            } catch (error) {
                console.error('Error loading messages:', error);
            }
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            if (!message) return;

            try {
                input.value = ''; // Clear immediately for better UX
                await ApiService.user.sendSupportMessage(message);
                loadMessages(); // Reload immediately
            } catch (error) {
                console.error('Error sending message:', error);
                alert('Failed to send message: ' + (error.message || 'Unknown error'));
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
    </script>
</body>

</html>
